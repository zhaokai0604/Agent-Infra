# 生产环境配置示例（勿提交含真实密钥的 application-prod.yml）
#
# 推荐：仅用环境变量（DB_URL / DB_PASSWORD / AI_API_KEY 等），不维护本地 yml。
# 启动：java -jar award-log.jar --spring.profiles.active=prod
# 麒麟 V11 + LoongArch：--spring.profiles.active=prod-kylin（见 application-kylin.yml）
#
# 若使用文件：复制本内容为 src/main/resources/application-prod.yml（该文件名已在 .gitignore）

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  ai:
    openai:
      api-key: ${AI_API_KEY}
      base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}

app:
  security:
    ai-audit-relaxed-read: false

agent:
  min-privilege:
    enabled: true
