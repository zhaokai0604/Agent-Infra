# ThreshCore — 麒麟 V11 生产 Nginx 样例（按需修改 server_name / 证书）
server {
    listen 80;
    server_name threshcore.example.com;

    root /opt/threshcore/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /award-log/ {
        proxy_pass http://127.0.0.1:8088/award-log/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /award-log/ws/ {
        proxy_pass http://127.0.0.1:8088/award-log/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # 生产勿对公网暴露 Actuator / Knife4j；仅内网或 VPN 可取消注释
    # location /award-log/doc.html { deny all; }
}
