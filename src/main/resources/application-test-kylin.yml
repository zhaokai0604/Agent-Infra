# 麒麟 V11 + LoongArch 联调测试（密钥通过环境变量注入，勿写入仓库）
# Profile：test-kylin（= prod + kylin + 本文件覆盖项）
# 启动前：export DB_PASSWORD=... AI_API_KEY=...
# Windows 本地开发请改回 spring.profiles.active=dev（application-local.yml 可覆盖）

spring:
  datasource:
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/log_analysis?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: threshcore
    password: ${DB_PASSWORD:}
  ai:
    openai:
      api-key: ${AI_API_KEY:}
      base-url: https://dashscope.aliyuncs.com/compatible-mode

award:
  middleware:
    kafka: false
    redis: false

app:
  security:
    ai-audit-relaxed-read: false

agent:
  min-privilege:
    enabled: false
  autonomous:
    run-after-patrol: false

log:
  collector:
    file:
      path: /var/log
  pipeline:
    decision:
      rf:
        force-heuristic-on-loongarch: true

elastic:
  enabled: false

management:
  endpoint:
    health:
      show-details: always
